<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authorization – Matchday Recap</title><meta name="robots" content="noindex"><style>
:root{--bg:#0b1220;--fg:#e8edf5;--mut:#9aa7bd;--ac:#2ecc71;--card:#131c2e}
@media(prefers-color-scheme:light){:root{--bg:#f5f7fb;--fg:#14202e;--mut:#5a6a80;--ac:#17a553;--card:#fff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 16px}h1{font-size:1.9rem;margin:.2em 0}h2{font-size:1.15rem;margin-top:1.8em;color:var(--ac)}
p,li{color:var(--fg)}.mut{color:var(--mut)}a{color:var(--ac)}nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px;font-size:.95rem}
.card{background:var(--card);padding:16px;border-radius:12px;word-break:break-all}code{font-size:1.05rem}
footer{margin-top:48px;color:var(--mut);font-size:.85rem}
</style></head>
<body><main><h1>Authorization</h1><p id="out">Completing login with TikTok…</p>
<script src="config.js"></script>
<script>
(function(){
  var C=window.APP_CONFIG,o=document.getElementById("out"),p=new URLSearchParams(location.search);
  var code=p.get("code"),state=p.get("state"),err=p.get("error");
  function fail(t){o.textContent=t;o.className="err";o.insertAdjacentHTML("afterend",'<p><a href="index.html">Back to start</a></p>');}
  var saved=null;try{saved=sessionStorage.getItem("tt_state");}catch(e){}
  history.replaceState(null,"",location.pathname);
  if(err){return fail("Authorization failed: "+(p.get("error_description")||err));}
  if(!code){return fail("No authorization code found. Please start the login from the start page.");}
  if(!saved||saved!==state){return fail("Security check failed (state mismatch). Please try again from the start page.");}
  fetch(C.worker+"/api/token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:code})})
   .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||r.status);return j;});})
   .then(function(j){try{sessionStorage.setItem("tt_token",j.access_token);sessionStorage.removeItem("tt_state");sessionStorage.setItem("tt_flash","TikTok account connected.");}catch(e){}location.replace("index.html");})
   .catch(function(e){fail("Could not complete login: "+e.message);});
})();
</script></main></body></html>
